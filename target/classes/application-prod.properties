logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.config.import=sm://

spring.cloud.gcp.sql.instance-connection-name=tms-microservices-2026:us-central1:postgres
spring.cloud.gcp.sql.database-name=authdb

#spring.datasource.url=${sm://database-url}
spring.datasource.username=${sm://database-username}
spring.datasource.password=${sm://database-password}
spring.datasource.driver-class-name=org.postgresql.Driver




management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never



jwt.secret=${sm://jwt-secret}
